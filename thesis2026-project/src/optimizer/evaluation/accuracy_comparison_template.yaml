  #   device: cpu
  #   threads: 4
  #   tflite_delegate: cpu

  # ── TensorRT native engine FP32 ───────────────────────────────────────────
  - name: trt_fp32
    kind: trt_engine
    model: ./optimizer/tvm_runner/out/experiments/trt_cache/trt_current/TensorrtExecutionProvider_TRTKernel_graph_main_graph_12725355770372969813_0_0_sm87.engine
    device: cuda:0

  # ── TensorRT native engine FP16 ───────────────────────────────────────────
  - name: trt_fp16
    kind: trt_engine
    model: ./optimizer/tvm_runner/out/experiments/trt_cache/trt_current/TensorrtExecutionProvider_TRTKernel_graph_main_graph_11605077208752094771_0_0_fp16_sm87.engine
    device: cuda:0

  # ── TensorRT with custom plugin (C2f model.2 replacement) ─────────────────
  # - name: trt_plugin_c2f
  #   kind: trt_engine
  #   model: /path/to/yolov8n_model2_plugin.engine
  #   device: cuda:0
  #   trt_plugin_so: /path/to/libc2f_m2_plugin.so

  # ── TVM GPU FP32 (Relax VirtualMachine) ──────────────────────────────────
  - name: tvm_gpu_fp32
    kind: tvm
    model: ../models/compiled_tvm_models/tvm_yolov8n_gpu_one_round_66_tasks_v6.so
    device: cuda:0
    tvm_device_type: cuda
    tvm_input_dtype: float32   # default; TVM module expects float32 input

  # ── TVM GPU FP16 (Relax VirtualMachine) ──────────────────────────────────
  - name: tvm_gpu_fp16
    kind: tvm
    model: ../models/compiled_tvm_models/tvm_yolov8n_gpu_one_round_66_tasks_float16_v7.so
    device: cuda:0
    tvm_device_type: cuda
    tvm_input_dtype: float16   # REQUIRED for fp16 compiled modules

