# yolo_accuracy_comparison.py — config template
#
# Usage:
#   python -m optimizer.evaluation.yolo_accuracy_comparison --config accuracy_comparison_template.yaml
#   # or from the project root:
#   python src/optimizer/evaluation/yolo_accuracy_comparison.py --config <this file>

comparison:
  data: ../datasets/coco/data.yaml          # Ultralytics dataset YAML with val split
  imgsz: 640
  batch: 1
  conf: 0.001                        # low conf to match official mAP evaluation
  iou: 0.7
  max_det: 300
  max_batches: 0                     # 0 = full val set; set e.g. 100 for a quick sanity check
  workers: 0                         # dataloader workers; 0 = main process (safest for low RAM)
  project: ./optimizer/evaluation/runs/accuracy_comparison
  save_json: true
  save_txt: true
  plots: false
  output_json: ./optimizer/evaluation/runs/accuracy_comparison/results.json

backends:

  # ── Baseline ──────────────────────────────────────────────────────────────
  - name: pytorch_fp32
    kind: torch
    model: ../models/yolov8n.pt
    device: cuda:0                      # or cuda:0
    baseline: true                   # all deltas are relative to this entry

  # ── PyTorch Eager FP16 ────────────────────────────────────────────────────
  - name: pytorch_fp16
    kind: torch
    model: ../models/yolov8n.pt
    device: cuda:0
    precision: fp16

  # # ── torch.compile (GPU: inductor; CPU: inductor / aot_eager) ─────────────
  # - name: pytorch_compile_inductor
  #   kind: torch_compile
  #   model: ../models/yolov8n.pt
  #   device: cpu
  #   compile_backend: inductor
  #   compile_mode: default            # default | reduce-overhead | max-autotune

  # ── ONNX Runtime CPU ──────────────────────────────────────────────────────
  # - name: onnxrt_cpu
  #   kind: ort
  #   model: ../models/quantized_models/onnx/yolov8n_opset17_fp32.onnx
  #   device: cpu

  # ── ONNX Runtime CUDA ─────────────────────────────────────────────────────
  - name: onnxrt_cuda
    kind: ort
    model: ../models/quantized_models/onnx/yolov8n_opset17_fp32.onnx
    device: cuda:0

  # ── ONNX Runtime CUDA FP16 ────────────────────────────────────────────────
  - name: onnxrt_cuda_fp16
    kind: ort
    model: ../models/quantized_models/onnx/yolov8n_opset17_fp16_clean.onnx
    device: cuda:0


  # # ── TFLite FP32 (CPU) ─────────────────────────────────────────────────────
  # - name: tflite_fp32_cpu
  #   kind: tflite
  #   model: ../models/quantized_models/yolov8n_tflite_int8/yolov8n_float32.tflite
  #   device: cpu
  #   threads: 4
  #   tflite_delegate: cpu

  # ── TFLite FP16 (CPU) ─────────────────────────────────────────────────────
